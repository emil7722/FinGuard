version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: finguard-postgres
    environment:
      POSTGRES_DB: finguard_db
      POSTGRES_USER: finguard_user
      POSTGRES_PASSWORD: finguard_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finguard_user -d finguard_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: