spring:
  application:
    name: finguard

  datasource:
    url: jdbc:postgresql://localhost:5432/finguard_db
    username: finguard_user
    password: finguard_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  error:
    include-message: always
    include-stacktrace: always
    include-exception: true
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

jwt:
  secret: MyVerySecureSecretKeyThatIsAtLeast512BitsLongForJWTTokenGenerationWithHS512AlgorithmEncryptionStandard
  expiration: 86400000

# Logging configuration
logging:
  level:
    root: INFO
    com.example.Finguard: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%-5level] %logger{36} - %msg%n"
