<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinGuard - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen p-6">
<div class="max-w-4xl mx-auto space-y-8">

    <!-- Header -->
    <header class="border-b border-gray-800 pb-4 flex justify-between items-center">
        <div>
            <h1 class="text-3xl font-bold tracking-tight text-emerald-400">FinGuard 🛡️</h1>
            <p class="text-sm text-gray-400">Core Transaction Processing & Ledger Dashboard</p>
        </div>
        <span class="bg-emerald-900/50 text-emerald-300 text-xs px-3 py-1 rounded-full border border-emerald-700">System Online</span>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

        <!-- 1. Create User Section -->
        <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-lg">
            <h2 class="text-xl font-semibold mb-4 text-indigo-400">1. Register User</h2>
            <form id="userForm" class="space-y-4">
                <div>
                    <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1">Full Name</label>
                    <input type="text" id="fullName" required class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm focus:outline-none focus:border-indigo-500" placeholder="Alex Developer">
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1">Email Address</label>
                    <input type="email" id="email" required class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm focus:outline-none focus:border-indigo-500" placeholder="alex@finguard.com">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 rounded text-sm transition">Create User</button>
            </form>
            <div id="userResult" class="mt-4 text-xs font-mono text-gray-400 bg-gray-900 p-2 rounded hidden"></div>
        </div>

        <!-- 2. Create Account Section -->
        <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-lg">
            <h2 class="text-xl font-semibold mb-4 text-indigo-400">2. Create Account</h2>
            <form id="accountForm" class="space-y-4">
                <div>
                    <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1">User UUID</label>
                    <input type="text" id="accUserId" required class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm focus:outline-none focus:border-indigo-500" placeholder="Paste User UUID">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1">Account Number / IBAN</label>
                        <input type="text" id="accountNumber" required class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm focus:outline-none focus:border-indigo-500" placeholder="AZ99FINGUARD...">
                    </div>
                    <div>
                        <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1">Initial Balance ($)</label>
                        <input type="number" step="0.01" id="initialBalance" value="500.00" required class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 rounded text-sm transition">Create Account</button>
            </form>
            <div id="accountResult" class="mt-4 text-xs font-mono text-gray-400 bg-gray-900 p-2 rounded hidden"></div>
        </div>

    </div>

    <!-- 3. Transfer Funds Section -->
    <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-lg">
        <h2 class="text-xl font-semibold mb-4 text-emerald-400">3. Execute Money Transfer</h2>
        <form id="transferForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1">Source Account UUID</label>
                <input type="text" id="sourceAccountId" required class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm focus:outline-none focus:border-emerald-500" placeholder="Sender Account ID">
            </div>
            <div>
                <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1">Destination Account UUID</label>
                <input type="text" id="destinationAccountId" required class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm focus:outline-none focus:border-emerald-500" placeholder="Receiver Account ID">
            </div>
            <div>
                <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1">Amount ($)</label>
                <input type="number" step="0.01" id="transferAmount" value="50.00" required class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm focus:outline-none focus:border-emerald-500">
            </div>
            <div>
                <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1">Idempotency Key</label>
                <input type="text" id="idempotencyKey" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm focus:outline-none focus:border-emerald-500" placeholder="e.g. transfer-uuid-123">
            </div>
            <div class="md:col-span-2">
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2 rounded text-sm transition">Send Transfer</button>
            </div>
        </form>
        <div id="transferResult" class="mt-4 text-xs font-mono text-gray-400 bg-gray-900 p-2 rounded hidden"></div>
    </div>

</div>

<!-- JavaScript to handle API calls -->
<script>
    // Auto-generate idempotency key on load
    document.getElementById('idempotencyKey').value = 'tx-key-' + Math.random().toString(36).substring(2, 9);

    // Create User
    document.getElementById('userForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const res = await fetch('/api/v1/users', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                fullName: document.getElementById('fullName').value,
                email: document.getElementById('email').value
            })
        });
        const data = await res.json();
        const resultBox = document.getElementById('userResult');
        resultBox.classList.remove('hidden');
        resultBox.textContent = `Success! User ID: ${data.id}`;
        document.getElementById('accUserId').value = data.id; // Auto-fill next form
    });

    // Create Account
    document.getElementById('accountForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const res = await fetch('/api/v1/accounts', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                userId: document.getElementById('accUserId').value,
                accountNumber: document.getElementById('accountNumber').value,
                initialBalance: parseFloat(document.getElementById('initialBalance').value),
                currency: "USD"
            })
        });
        const data = await res.json();
        const resultBox = document.getElementById('accountResult');
        resultBox.classList.remove('hidden');
        resultBox.textContent = `Success! Account ID: ${data.id} (Balance: $${data.balance})`;
    });

    // Transfer Funds
    document.getElementById('transferForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const res = await fetch('/api/v1/transactions/transfer', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                sourceAccountId: document.getElementById('sourceAccountId').value,
                destinationAccountId: document.getElementById('destinationAccountId').value,
                amount: parseFloat(document.getElementById('transferAmount').value),
                currency: "USD",
                idempotencyKey: document.getElementById('idempotencyKey').value
            })
        });
        const data = await res.json();
        const resultBox = document.getElementById('transferResult');
        resultBox.classList.remove('hidden');
        resultBox.textContent = `Status: ${data.status} | Source Balance left: $${data.sourceAccount?.balance} | Dest Balance: $${data.destinationAccount?.balance}`;
    });
</script>
</body>
</html>
